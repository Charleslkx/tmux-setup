# Managed by tmux-setup. Edit this file to change the distributed defaults.
# Re-running tmux-setup.sh backs up an existing ~/.tmux.conf before replacing it.

# SSH-friendly practical defaults.
set -g mouse on
set -g focus-events on
set -g history-limit 100000

# Prefer tmux-256color when the host has its terminfo entry. This fallback keeps
# the configuration usable on older/minimal Ubuntu and macOS installations.
if-shell 'command -v infocmp >/dev/null 2>&1 && infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Plugin manager and practical defaults.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Keep automatic session snapshots, but do not reopen programs automatically.
set -g @continuum-restore 'off'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins 'cpu-usage ram-usage time'

# Load TPM last so it can process all @plugin declarations above.
run '~/.tmux/plugins/tpm/tpm'
